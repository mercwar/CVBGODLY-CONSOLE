<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Constellation Client Loader</title>
<link rel="stylesheet" href="https://mercwar.github.io/Constellation/LIVE/HOST/constellation.css">
</head>

<body>

<div id="app">

    <header id="top-bar">
        <div id="title">SITE SURFER</div>
        <div id="sub">Client Loader</div>
    </header>

    <main id="main">
        <div id="glass-panel">

            <div id="status">Waiting…</div>

            <!-- HOST SIDEBAR -->
            <div id="host-sidebar"></div>

            <!-- HOST MAIN CONTENT -->
            <div id="host-content"></div>

        </div>
    </main>

    <footer id="bottom-bar">
        <span id="footer-text">Constellation Client Loader</span>
    </footer>

</div>
<script>
// AIFVS-ARTIFACT
// AVIS: client-loader.js

document.addEventListener("DOMContentLoaded", () => {

    const params = new URLSearchParams(window.location.search);
    let repo = params.get("index") || "mercwar";

    const status = document.getElementById("status");
    const hostContent = document.getElementById("host-content");
    const hostSidebar = document.getElementById("host-sidebar");

    function buildURL(r) {
        return `https://mercwar.github.io/Constellation/LIVE/HOST/index.html`;
    }

    function sanitizeHTML(html) {
        // Remove scripts, links, and full-page wrappers
        return html
            .replace(/<script[\s\S]*?<\/script>/gi, "")
            .replace(/<link[\s\S]*?>/gi, "")
            .replace(/<!DOCTYPE[\s\S]*?>/gi, "")
            .replace(/<html[\s\S]*?>/gi, "")
            .replace(/<\/html>/gi, "")
            .replace(/<head[\s\S]*?>[\s\S]*?<\/head>/gi, "")
            .replace(/<body[\s\S]*?>/gi, "")
            .replace(/<\/body>/gi, "");
    }

    function loadHost(r) {
        const url = buildURL(r);

        status.textContent = `Loading HOST for repo: ${r}…`;

        return fetch(url)
            .then(res => res.text())
            .then(raw => {

                const html = sanitizeHTML(raw);

                const temp = document.createElement("div");
                temp.innerHTML = html;

                // Extract sidebar
                const sidebar = temp.querySelector("#sidebar");
                hostSidebar.innerHTML = "";
                if (sidebar) hostSidebar.appendChild(sidebar);

                // Extract content
                const inject = temp.querySelector("#inject");
                const viewer = temp.querySelector("#viewer");

                hostContent.innerHTML = "";
                if (inject) hostContent.appendChild(inject);
                if (viewer) hostContent.appendChild(viewer);

                status.textContent = `HOST loaded for ${r}.`;
            });
    }

    loadHost(repo).catch(err => {
        status.textContent = "Load failed: " + err;
    });

});
</script>



</body>
</html>
